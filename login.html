<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UBICHAIN · SMS Login</title><style>
:root{--c:#00d4ff;--bg:#020408;--fg:#d8f6ff;--m:#6a8a96;--line:rgba(0,212,255,.3);--bad:#ff7186}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}.card{width:min(420px,calc(100% - 32px));border:1px solid var(--line);background:rgba(2,10,16,.92);padding:24px}.k{color:var(--c);font-size:10px;letter-spacing:.25em}h1{margin:6px 0 8px;font-size:25px;font-weight:500}p{color:var(--m);font-size:12px}label{display:block;margin-top:18px;color:var(--m);font-size:11px;letter-spacing:.12em}input{width:100%;height:44px;margin-top:6px;border:1px solid var(--line);background:#020408;color:var(--fg);padding:0 12px;font:16px ui-monospace,monospace;outline:0}input:focus{border-color:var(--c)}button{width:100%;min-height:44px;margin-top:16px;border:0;background:var(--c);color:#020408;font:600 13px ui-monospace,monospace;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.hidden{display:none}.error{min-height:18px;margin-top:12px;color:var(--bad);font-size:11px}a{color:var(--c);font-size:11px}
</style></head><body><main class="card"><div class="k">UBICHAIN · ACCOUNT</div><h1>SMSログイン</h1><p>携帯電話番号へ送信した6桁コードでマイページを開きます。</p><form id="phone-form"><label>携帯電話番号<input id="phone" inputmode="tel" autocomplete="tel" placeholder="080-0000-0000" required></label><button>コードを送信</button></form><form id="code-form" class="hidden"><label>認証コード<input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required></label><button>ログイン</button></form><div id="error" class="error" role="alert"></div><p><a href="index.html">Q DESKへ戻る</a></p></main><script>
const error=document.getElementById('error'),phoneForm=document.getElementById('phone-form'),codeForm=document.getElementById('code-form'),phone=document.getElementById('phone'),code=document.getElementById('code');let sending=false;
async function request(url,body){const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'request_failed');return data}
function message(key){return({invalid_phone:'日本の携帯電話番号を入力してください。',rate_limited:'送信回数の上限です。時間をおいて再試行してください。',sms_not_configured:'SMSログインは現在設定中です。',sms_delivery_failed:'SMSを送信できませんでした。',invalid_code:'認証コードが正しくありません。'})[key]||'処理に失敗しました。'}
phoneForm.onsubmit=async event=>{event.preventDefault();if(sending)return;sending=true;error.textContent='';phoneForm.querySelector('button').disabled=true;try{await request('/api/auth/sms-start',{phone:phone.value});phoneForm.classList.add('hidden');codeForm.classList.remove('hidden');code.focus()}catch(e){error.textContent=message(e.message)}finally{sending=false;phoneForm.querySelector('button').disabled=false}};
codeForm.onsubmit=async event=>{event.preventDefault();if(sending)return;sending=true;error.textContent='';codeForm.querySelector('button').disabled=true;try{await request('/api/auth/sms-verify',{phone:phone.value,code:code.value});location.replace('account.html')}catch(e){error.textContent=message(e.message)}finally{sending=false;codeForm.querySelector('button').disabled=false}};
</script></body></html>
